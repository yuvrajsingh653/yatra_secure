spring.application.name=Yatra-secure

spring.datasource.url=jdbc:mysql://localhost:3306/yatra_secure
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
assistant.api-key=${ASSISTANT_API_KEY:}
assistant.base-url=${ASSISTANT_BASE_URL:https://api.openai.com/v1}
assistant.model=${ASSISTANT_MODEL:gpt-4o-mini}
app.public-app-base-url=${PUBLIC_APP_BASE_URL:${FRONTEND_URL:${public.app.base-url}}}
spring.config.import=optional:file:./application-local.properties


